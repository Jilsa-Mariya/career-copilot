      -webkit-text-fill-color: transparent;

    .gradient-border-btn {

    /* Keyframes for simple typing indicator */
    .typing-dot {
      animation: typing-bounce 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    // ==========================================
    // NEW APPLICATION MODAL
    // ==========================================
    function NewApplicationModal({ onClose, onSubmit }) {
      const [company, setCompany] = useState("");
      const [role, setRole] = useState("");
      const [resumeFile, setResumeFile] = useState(null);
      const [jdText, setJdText] = useState("");
      const [dragActive, setDragActive] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisProgress, setAnalysisProgress] = useState(0);
      const [analysisStep, setAnalysisStep] = useState("");

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragActive(true);
        } else if (e.type === "dragleave") {
          setDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          setResumeFile(e.dataTransfer.files[0]);
        }
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          setResumeFile(e.target.files[0]);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!company || !role || !resumeFile || !jdText) {
          alert("Please fill in all the required fields and upload a PDF resume.");
          return;
        }

        setIsAnalyzing(true);
        setAnalysisStep("Extracting and parsing text from resume...");
        setAnalysisProgress(15);

        // Simulation of analysis steps
        setTimeout(() => {
          setAnalysisStep("Analyzing ATS keyword matches...");
          setAnalysisProgress(45);
        }, 1000);

        setTimeout(() => {
          setAnalysisStep("Generating personalized missing skills roadmap...");
          setAnalysisProgress(75);
        }, 2000);

        setTimeout(() => {
          setAnalysisStep("Compiling structured interview preparation questions...");
          setAnalysisProgress(95);
        }, 3000);

        setTimeout(() => {
          onSubmit({
            company,
            role,
            resume_filename: resumeFile.name,
            jd_text: jdText,
          });
          setIsAnalyzing(false);
          onClose();
        }, 3800);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-4 overflow-y-auto">
          {/* Backdrop blur */}
          <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={onClose}></div>
          
          <div className="glass-card rounded-2xl border-slate-800 max-w-2xl w-full p-6 sm:p-8 z-10 relative overflow-hidden shadow-2xl">
            {isAnalyzing ? (
              <div className="py-12 flex flex-col items-center justify-center text-center">
                <div className="relative w-24 h-24 mb-6">
                  {/* Glowing spinner */}
                  <div className="absolute inset-0 border-4 border-slate-900 rounded-full"></div>
                  <div className="absolute inset-0 border-4 border-primary-500 rounded-full border-t-transparent animate-spin"></div>
                  <div className="absolute inset-0 flex items-center justify-center">
                    <Icons.Sparkles className="w-8 h-8 text-primary-400 animate-pulse-subtle" />
                  </div>
                </div>
                <h3 className="font-heading font-bold text-xl text-white">Analyzing Profile</h3>
                <p className="text-sm text-slate-400 mt-2 max-w-sm h-12 transition-all duration-300">
                  {analysisStep}
                </p>
                <div className="w-full bg-slate-900 rounded-full h-2.5 mt-6 max-w-md overflow-hidden border border-slate-800">
                  <div 
                    className="bg-gradient-to-r from-primary-500 to-indigo-500 h-2.5 rounded-full transition-all duration-500 ease-out" 
                    style={{ width: `${analysisProgress}%` }}
                  ></div>
                </div>
                <span className="text-xs text-slate-500 mt-2 font-medium">{analysisProgress}% Complete</span>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-6">
                <div className="flex items-center justify-between border-b border-slate-900 pb-4">
                  <div>
                    <h2 className="font-heading font-extrabold text-xl text-white">Create Job Application Workspace</h2>
                    <p className="text-xs text-slate-400 mt-1">Upload resume and job description to compare match profiles.</p>
                  </div>
                  <button 
                    type="button" 
                    onClick={onClose}
                    className="text-slate-500 hover:text-slate-300 p-1 rounded-lg hover:bg-slate-900 transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Company Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. OpenAI, Stripe"
                      value={company}
                      onChange={(e) => setCompany(e.target.value)}
                      className="w-full bg-slate-900/60 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-primary-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Job Role *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Full Stack Engineer"

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Job Description *</label>

                    rows="5"
                    placeholder="Paste the full job description text here to run keyword comparison analysis..."
                    value={jdText}
                    onChange={(e) => setJdText(e.target.value)}

                    type="submit"
                    className="gradient-border-btn px-5 py-2.5 text-xs font-semibold text-white flex items-center space-x-1.5 shadow-md shadow-indigo-500/10"

                    <Icons.Sparkles className="w-4 h-4 text-white" />

    // ==========================================
    // WORKSPACE COMPONENT
    // ==========================================
    function Workspace({ 
      application, 
      currentTab, 
      onChangeTab, 
      onUpdateStatus, 
      onSaveNotes, 
      activeInterview, 
      onStartInterview 
    }) {
      const getStatusStyle = (status) => {
        switch (status) {
          case "Saved": return "bg-slate-500/10 text-slate-400 border-slate-500/20";
          case "Applied": return "bg-sky-500/10 text-sky-400 border-sky-500/20";
          case "Assessment": return "bg-amber-500/10 text-amber-400 border-amber-500/20";
          case "Interview": case "Interviewing": return "bg-indigo-500/10 text-indigo-400 border-indigo-500/20";
          case "Selected": case "Offered": return "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
          case "Rejected": return "bg-rose-500/10 text-rose-400 border-rose-500/20";
          default: return "bg-slate-500/10 text-slate-400 border-slate-500/20";
        }
      };

      return (
        <div className="flex-grow flex flex-col md:flex-row h-full">
          {/* Workspace Left Navigation Sidebar */}
          <aside className="w-full md:w-64 border-b md:border-b-0 md:border-r border-slate-900 bg-slate-950 flex flex-col">
            {/* Header in sidebar */}
            <div className="p-6 border-b border-slate-900 bg-slate-900/10">
              <h2 className="font-heading font-extrabold text-lg text-white truncate">{application.company}</h2>
              <p className="text-xs text-slate-400 font-medium truncate mt-0.5">{application.role}</p>
              <div className="mt-3 flex items-center space-x-2">
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${getStatusStyle(application.status)}`}>
                  {application.status}
                </span>
                <span className="text-[10px] text-slate-500 font-semibold">{application.match_score}% Match</span>
              </div>
            </div>

            {/* Sidebar list items */}
            <nav className="flex-grow p-4 space-y-1 overflow-y-auto">
              {[
                { id: "overview", label: "Overview", icon: Icons.Award },
                { id: "resume", label: "Resume", icon: Icons.FileText },
                { id: "jd", label: "Job Description", icon: Icons.Briefcase },
                { id: "learning", label: "Learning Hub", icon: Icons.BookOpen },
                { id: "interview", label: "Interview Prep", icon: Icons.Users },
                { id: "coach", label: "AI Coach", icon: Icons.Sparkles },
                { id: "notes", label: "Notes", icon: Icons.Edit3 }
              ].map(tab => {
                const TabIcon = tab.icon;
                const isSelected = currentTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => onChangeTab(tab.id)}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${
                      isSelected 
                        ? "bg-primary-600/15 text-primary-400 border border-primary-500/10 shadow-sm" 
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-900/50 border border-transparent"
                    }`}
                  >
                    <TabIcon className={`w-4 h-4 ${isSelected ? "text-primary-400" : "text-slate-500"}`} />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* Right Workspace Content Area */}
          <section className="flex-grow bg-dark-950/40 p-6 sm:p-8 overflow-y-auto max-w-7xl">
            {currentTab === "overview" && (
              <OverviewTab 
                application={application} 
                onUpdateStatus={onUpdateStatus}
                getStatusStyle={getStatusStyle}
              />
            )}
            
            {currentTab === "resume" && (
              <ResumeTab application={application} />
            )}

            {currentTab === "jd" && (
              <JobDescriptionTab application={application} />
            )}

            {currentTab === "learning" && (
              <LearningHubTab application={application} />
            )}

            {currentTab === "interview" && (
              <InterviewPrepTab 
                application={application} 
                activeInterview={activeInterview}
                onStartInterview={onStartInterview}
              />
            )}

            {currentTab === "coach" && (
              <AICoachTab application={application} />
            )}

            {currentTab === "notes" && (
              <NotesTab 
                application={application} 
                onSaveNotes={onSaveNotes}
              />
            )}
          </section>
        </div>
      );
    }

    // ==========================================
    // OVERVIEW TAB
    // ==========================================

      return (
        <div className="space-y-8 animate-fadeIn">
          {/* Header */}
          <div>
            <h2 className="font-heading font-extrabold text-2xl text-white">Application Analysis Overview</h2>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Match score gauge */}

              <div className="space-y-1">
                <p className="text-xs text-slate-400 font-semibold uppercase tracking-wider">ATS Score Match</p>

                <p className="text-xs text-slate-500 mt-1 font-medium">
                  {application.match_score >= 80 ? "Excellent ATS match" : application.match_score >= 65 ? "Solid Match (Refine Resume)" : "Action Required"}

              <div className="relative w-20 h-20 flex items-center justify-center">
                <svg className="w-full h-full transform -rotate-90">
                  <circle cx="40" cy="40" r="32" stroke="rgba(30, 41, 59, 0.4)" strokeWidth="6" fill="transparent" />
                  <circle 
                    cx="40" cy="40" r="32" 
                    stroke={application.match_score >= 80 ? "#10b981" : application.match_score >= 70 ? "#f59e0b" : "#8b5cf6"} 
                    strokeWidth="6" 
                    fill="transparent"
                    strokeDasharray={201}
                    strokeDashoffset={201 - (201 * application.match_score) / 100}

                </svg>
                <span className={`absolute font-heading font-bold text-sm ${getCircularProgressColor(application.match_score)}`}>
                  {application.match_score}%

            {/* Status manager */}

                    value={status}

                  >
                    {["Saved", "Applied", "Assessment", "Interviewing", "Offered", "Rejected"].map(s => (
                      <option key={s} value={s}>{s}</option>
                    ))}
                  </select>
                  <button 
                    onClick={handleSave}
                    className="bg-primary-600 hover:bg-primary-700 text-xs text-white font-bold px-4 py-2.5 rounded-lg border border-primary-500 shadow-lg shadow-primary-500/10 transition-colors"

                    Update Status
                  </button>
                </div>
              </div>
              <div className="mt-2 h-4">
                {showSavedMsg && (
                  <span className="text-[10px] text-emerald-400 font-bold flex items-center">
                    ✓ Status updated to '{status}' successfully!
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* Strengths & Missing skills tags */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="glass-card rounded-2xl p-6 border-slate-800">
              <h3 className="font-heading font-bold text-sm text-slate-200 uppercase tracking-wider mb-4 flex items-center">
                <Icons.CheckCircle className="w-5 h-5 text-emerald-400 mr-2" />
                <span>Verified Strengths ({application.strengths.length})</span>
              </h3>
              <div className="flex flex-wrap gap-2">
                {application.strengths.map(skill => (
                  <span key={skill} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500/5 text-emerald-400 border border-emerald-500/10 flex items-center">
                    <Icons.Check className="w-3.5 h-3.5 mr-1 text-emerald-400" />
                    {skill}
                  </span>
                ))}
              </div>
            </div>

            <div className="glass-card rounded-2xl p-6 border-slate-800">
              <h3 className="font-heading font-bold text-sm text-slate-200 uppercase tracking-wider mb-4 flex items-center">
                <Icons.AlertCircle className="w-5 h-5 text-rose-400 mr-2" />

                  <p className="text-sm text-slate-300 leading-relaxed font-medium">{improvement}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MOCK INTERVIEW SIMULATOR
    // ==========================================
    function MockInterviewSimulator({ interviewType, questions = [], onBack }) {
      const [qIndex, setQIndex] = useState(0);
      const [answer, setAnswer] = useState("");
      const [isEvaluating, setIsEvaluating] = useState(false);
      const [evaluation, setEvaluation] = useState(null);

      const currentQuestion = questions[qIndex] || "How do you handle technical debt?";

      const handleSubmitAnswer = () => {
        if (!answer.trim()) {
          alert("Please type in an answer to evaluate.");
          return;
        }

        setIsEvaluating(true);
        setEvaluation(null);

        // Simulated AI evaluation response delay
        setTimeout(() => {
          setIsEvaluating(false);
          setEvaluation(mockEvaluationReport);
        }, 2000);
      };

      const handleNextQuestion = () => {
        setAnswer("");
        setEvaluation(null);
        if (qIndex < questions.length - 1) {
          setQIndex(qIndex + 1);
        } else {
          alert("Excellent job! You have completed all mock interview questions for this track.");
          onBack();
        }
      };

      return (
        <div className="glass-card rounded-2xl border-slate-800 overflow-hidden animate-fadeIn">
          {/* Simulator Bar */}
          <div className="bg-slate-950 p-4 border-b border-slate-900/80 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
              <span className="text-xs text-slate-400 font-bold uppercase tracking-wider">{interviewType} MOCK SIMULATOR</span>
            </div>
            <button 
              onClick={onBack}
              className="text-xs text-slate-400 hover:text-slate-200 font-semibold flex items-center"
            >
              ← Terminate Session
            </button>
          </div>

          <div className="p-6 sm:p-8 space-y-6">
            {/* Progress indicator */}
            <div className="flex items-center justify-between">
              <span className="text-[10px] text-slate-500 font-bold uppercase">Question {qIndex + 1} of {questions.length}</span>
              <div className="w-32 bg-slate-900 rounded-full h-1.5 overflow-hidden border border-slate-850">
                <div 
                  className="bg-primary-500 h-1.5 rounded-full transition-all duration-300"
                  style={{ width: `${((qIndex + 1) / questions.length) * 100}%` }}
                ></div>
              </div>
            </div>

            {/* Question card */}
            <div className="bg-slate-900/40 p-5 rounded-xl border border-slate-900">
              <p className="text-xs font-bold text-primary-400 uppercase tracking-wider">INTERVIEWER QUESTION:</p>
              <p className="text-base sm:text-lg font-semibold text-white mt-1 leading-relaxed">
                "{currentQuestion}"
              </p>
            </div>

            {/* Response Area */}
            {!evaluation && !isEvaluating && (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Type your response below:</label>
                  <textarea
                    rows="6"
                    placeholder="Provide a comprehensive response. Draw on your personal project accomplishments or work experiences..."
                    value={answer}
                    onChange={(e) => setAnswer(e.target.value)}
                    className="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-primary-500 leading-relaxed"
                  ></textarea>
                </div>
                <div className="flex justify-end">
                  <button 
                    onClick={handleSubmitAnswer}
                    className="bg-primary-600 hover:bg-primary-700 text-xs font-bold text-white px-5 py-2.5 rounded-lg border border-primary-500 shadow-lg shadow-primary-500/10 flex items-center space-x-1.5 transition-colors"
                  >
                    <span>Submit Answer for AI Evaluation</span>
                    <span>→</span>
                  </button>
                </div>
              </div>
            )}

            {/* Evaluating State */}
            {isEvaluating && (
              <div className="py-10 flex flex-col items-center justify-center text-center">
                <div className="flex space-x-1 mb-4">
                  <div className="w-3 h-3 bg-primary-500 rounded-full animate-bounce" style={{ animationDelay: '0s' }}></div>
                  <div className="w-3 h-3 bg-primary-500 rounded-full animate-bounce" style={{ animationDelay: '0.15s' }}></div>
                  <div className="w-3 h-3 bg-primary-500 rounded-full animate-bounce" style={{ animationDelay: '0.3s' }}></div>
                </div>
                <h3 className="font-heading font-semibold text-sm text-slate-300">Analyzing answer response patterns...</h3>
                <p className="text-xs text-slate-500 mt-1">Gemini AI is parsing vocabulary, semantic matches, and structure coherence.</p>
              </div>
            )}

            {/* Evaluation feedback report */}
            {evaluation && (
              <div className="space-y-6 bg-slate-900/20 p-6 rounded-xl border border-slate-900 animate-fadeIn">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-900 gap-4">
                  <div className="flex items-center space-x-3">
                    <span className="p-2.5 bg-emerald-500/10 rounded-xl text-emerald-400 border border-emerald-500/20">
                      <Icons.Award className="w-5 h-5" />
                    </span>
                    <div>
                      <h4 className="font-heading font-bold text-base text-slate-200">AI Evaluation Feedback</h4>
                      <p className="text-[10px] text-slate-500 font-semibold uppercase">Keyword accuracy matching algorithms</p>
                    </div>
                  </div>
                  <div className="flex items-baseline space-x-1 bg-slate-950 px-4 py-2 rounded-xl border border-slate-850">
                    <span className="text-xs text-slate-500 font-semibold">SCORE:</span>
                    <span className="text-lg font-heading font-extrabold text-emerald-400">{evaluation.score}</span>
                    <span className="text-xs text-slate-500 font-semibold">/10</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h5 className="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3 flex items-center">
                      <Icons.CheckCircle className="w-4 h-4 mr-1.5" /> Strengths
                    </h5>
                    <ul className="space-y-2">
                      {evaluation.strengths.map((s, i) => (
                        <li key={i} className="text-xs text-slate-300 leading-relaxed font-medium bg-emerald-500/5 p-3 rounded-lg border border-emerald-500/10">
                          {s}
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div>
                    <h5 className="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center">
                      <Icons.AlertCircle className="w-4 h-4 mr-1.5" /> Recommendations
                    </h5>
                    <ul className="space-y-2">
                      {evaluation.improvements.map((s, i) => (
                        <li key={i} className="text-xs text-slate-300 leading-relaxed font-medium bg-amber-500/5 p-3 rounded-lg border border-amber-500/10">
                          {s}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>

                <div className="flex justify-end pt-4 border-t border-slate-900">
                  <button 
                    onClick={handleNextQuestion}
                    className="bg-slate-900 hover:bg-slate-850 border border-slate-800 text-xs font-bold text-white px-5 py-2.5 rounded-lg transition-colors"
                  >
                    {qIndex < questions.length - 1 ? "Proceed to Next Question" : "Complete Interview Track"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // AI COACH TAB
    // ==========================================
    function AICoachTab({ application }) {
      const [messages, setMessages] = useState([
        { role: "assistant", content: `Hello! I am your AI Career Coach. I have loaded all context regarding your parsed resume and your target role as a **${application.role}** at **${application.company}**.\n\nAsk me anything! I can help you prepare a custom cover letter outline, draft responses to difficult resume gaps, or plan a networking message strategy for recruiters.` }
      ]);
      const [inputValue, setInputValue] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = useRef(null);

      // Keep scroll state aligned
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!inputValue.trim()) return;

        const userMsg = { role: "user", content: inputValue };
        setMessages(prev => [...prev, userMsg]);
        setInputValue("");
        setIsTyping(true);

        // Generate tailored AI coach responses based on inputs
        setTimeout(() => {
          setIsTyping(false);
          let coachReply = "";
          const query = inputValue.toLowerCase();
          
          if (query.includes("cover") || query.includes("letter")) {
            coachReply = `Here is a custom **Cover Letter Hook** tailored for **${application.company}**:\n\n*"Dear Hiring Manager,\n\nI was thrilled to see the opening for a ${application.role} at ${application.company}. Having followed ${application.company}'s recent work on scaling platforms, and with hands-on experience in Python and Flask (used to build predictive tools like ThermaSense), I am eager to apply my skills to your backend engineering initiatives. My background allows me to build stable APIs while rapidly picking up team technologies like Java and Docker..."*`;
          } else if (query.includes("resume") || query.includes("improve") || query.includes("strength")) {
            coachReply = `Looking at your ATS analysis, your core strength is **Python** and **SQL**. However, you should focus on **Java** and **Docker** to meet the job description's preferred stacks.\n\nI recommend revising your resume project bullets to quantify your results. Instead of *"Trained LSTM models for server temperature prediction"*, try: \n\n*"Developed AI-based LSTM models that improved temperature prediction accuracy by 14%, directly reducing simulated server cooling overhead."*`;
          } else {
            coachReply = `That is an excellent question regarding your application for the **${application.role}** at **${application.company}**.\n\nTo make your profile stand out, I suggest drafting a short connection note to their senior engineers on LinkedIn. You can mention your passion for backend scalability and reference the projects (like ThermaSense or SkillTrack) that you've developed.\n\nWould you like me to draft a LinkedIn networking message for you, or focus on some potential technical questions?`;
          }

          setMessages(prev => [...prev, { role: "assistant", content: coachReply }]);
        }, 1500);
      };

      return (
        <div className="glass-card rounded-2xl border-slate-800 flex flex-col h-[520px] overflow-hidden animate-fadeIn">
          {/* Chat header */}
          <div className="bg-slate-950 p-4 border-b border-slate-900/60 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary-600 to-indigo-500 flex items-center justify-center">
                <Icons.Sparkles className="w-4 h-4 text-white animate-pulse" />
              </div>
              <div>
                <h3 className="font-heading font-bold text-sm text-slate-200">Coach Gemini</h3>
                <p className="text-[10px] text-slate-500 font-semibold uppercase">Active Copilot Session</p>
              </div>
            </div>
            <div className="flex items-center space-x-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Online Context Loaded</span>
            </div>
          </div>

          {/* Message view */}
          <div className="flex-grow p-4 sm:p-6 overflow-y-auto space-y-4 bg-slate-900/10">
            {messages.map((msg, idx) => (
              <div 
                key={idx} 
                className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"} animate-fadeIn`}
              >
                <div 
                  className={`max-w-[85%] sm:max-w-[70%] p-3.5 rounded-2xl text-sm leading-relaxed ${
                    msg.role === "user" 
                      ? "bg-primary-600 text-white rounded-tr-none shadow-md shadow-primary-500/10 font-semibold" 
                      : "bg-slate-900 border border-slate-800 text-slate-300 rounded-tl-none font-medium whitespace-pre-line"
                  }`}
                >
                  {msg.content}
                </div>
              </div>
            ))}

            {isTyping && (
              <div className="flex justify-start">
                <div className="bg-slate-900 border border-slate-850 p-4 rounded-2xl rounded-tl-none flex space-x-1 items-center">
                  <span className="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                  <span className="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                  <span className="w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot"></span>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Form input */}
          <form onSubmit={handleSend} className="p-4 bg-slate-950 border-t border-slate-900 flex space-x-2">
            <input
              type="text"
              placeholder="Ask Coach Gemini about cover letters, resume edits, or interview tricks..."
              value={inputValue}
              onChange={(e) => setInputValue(e.target.value)}
              className="flex-grow bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-primary-500"
            />
            <button 
              type="submit"
              className="p-2.5 bg-primary-600 hover:bg-primary-700 rounded-xl text-white border border-primary-500 shadow-md shadow-primary-500/10 transition-all flex items-center justify-center flex-shrink-0"
            >
              <Icons.Send className="w-5 h-5" />
            </button>
          </form>
        </div>
      );
    }

              onChange={(e) => setNotes(e.target.value)}
